<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>商品一覧</title>
<style>
body { font-family: sans-serif; padding: 10px; }

#lastUpdate {
  margin-bottom: 10px;
  font-weight: bold;
}

input {
  padding: 8px;
  width: 100%;
  margin-bottom: 10px;
  font-size: 16px;
}

table {
  border-collapse: collapse;
  width: 100%;
}

th, td {
  border: 1px solid #444;
  padding: 6px;
}

th {
  background: #ddd;
}
</style>
</head>
<body>

<h2>📊 商品一覧</h2>

<div id="lastUpdate">読み込み中...</div>

<input type="text" id="search" placeholder="検索">

<table id="table"></table>

<script>
let data = [];

fetch("items_2026-04-06.csv")
.then(res => res.text())
.then(text => {
  const rows = text.trim().split("\n");
  data = rows.map(r => r.split(","));

  // 🔥 最終更新を取得
  const times = rows.slice(1).map(r => new Date(r.split(",")[0]));
  const latest = new Date(Math.max(...times));

  document.getElementById("lastUpdate").innerText =
    "最終更新: " + latest.toLocaleString();

  render(data);
});

// 表描画
function render(rows) {
  const table = document.getElementById("table");
  table.innerHTML = "";

  rows.forEach((cols, i) => {
    const tr = document.createElement("tr");

    cols.forEach(col => {
      const cell = document.createElement(i === 0 ? "th" : "td");
      cell.textContent = col;
      tr.appendChild(cell);
    });

    table.appendChild(tr);
  });
}

// 検索
document.getElementById("search").addEventListener("input", function() {
  const keyword = this.value.toLowerCase();

  const filtered = data.filter((row, i) => {
    if (i === 0) return true;
    return row.some(col => col.toLowerCase().includes(keyword));
  });

  render(filtered);
});
</script>

</body>
</html>
