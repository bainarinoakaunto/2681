<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyStudy calendar</title>

<style>

body{
    margin:0;
    font-family:sans-serif;
    background:#f5f5f5;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:15px;
}

nav{
    display:flex;
    background:#111;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:15px;
}

nav button{
    flex:1;
    padding:12px;
    border:none;
    background:#222;
    color:#fff;
    cursor:pointer;
}

nav button:hover{
    background:#444;
}

input,textarea,button{
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #ddd;
    box-sizing:border-box;
}

button{
    background:#111;
    color:#fff;
    border:none;
}

#statsBox{
    background:#fff;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:10px;
}

.day{
    background:#fff;
    border-radius:12px;
    padding:10px;
    min-height:120px;
    border:1px solid #ddd;
    cursor:pointer;
}

.today{
    border:2px solid #4caf50;
}

.date{
    font-weight:bold;
    margin-bottom:8px;
}

.subject{
    background:#111;
    color:#fff;
    display:inline-block;
    padding:3px 8px;
    border-radius:999px;
    font-size:11px;
    margin-bottom:5px;
}

.memo{
    font-size:12px;
    color:#444;
}

.count{
    font-size:11px;
    color:#4caf50;
    margin-top:5px;
}

/* モーダル */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
}

.modal-box{
    background:#fff;
    width:90%;
    max-width:500px;
    border-radius:15px;
    padding:20px;
    max-height:80vh;
    overflow:auto;
}

.record{
    border:1px solid #ddd;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
}

.deleteBtn{
    background:#ff4d4d;
    margin-top:8px;
}

/* 通知 */

#toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#4caf50;
    color:#fff;
    padding:12px 20px;
    border-radius:999px;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:0.3s;
    z-index:9999;
}

#toast.show{
    opacity:1;
    bottom:35px;
}

@media(max-width:700px){

    .calendar{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>
</head>

<body>

<div class="container">

<nav>
    <button onclick="showPage('cal')">カレンダー</button>
    <button onclick="showPage('rec')">記録</button>
</nav>

<!-- 月切替 -->

<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;">

    <button onclick="prevMonth()">⬅</button>

    <div id="monthLabel"></div>

    <button onclick="nextMonth()">➡</button>

</div>

<!-- 統計 -->

<div id="statsBox">

    <b>📊 今月のまとめ</b>

    <div id="statsText"></div>

</div>

<!-- カレンダー -->

<div id="cal">

    <div class="calendar" id="calendar"></div>

</div>

<!-- 記録 -->

<div id="rec" style="display:none;">

    <h2>✏️ 勉強記録</h2>

    <input type="date" id="date">

    <input type="text" id="subject" placeholder="教科">

    <input type="text" id="book" placeholder="教材名">

    <input type="number" id="pages" placeholder="ページ数">

    <textarea id="memo" placeholder="学習したページNo."></textarea>

    <button onclick="save()">保存</button>

    <hr>

    <h3>📦 バックアップ / 復元</h3>

    <button onclick="exportData()">
        データをダウンロード
    </button>

    <input type="file" id="file">

    <button onclick="importData()">
        データを復元
    </button>

</div>

</div>

<!-- 詳細 -->

<div class="modal" id="detailModal">

    <div class="modal-box">

        <h2>📘 詳細</h2>

        <div id="detail"></div>

        <button onclick="closeDetail()">
            閉じる
        </button>

    </div>

</div>

<!-- 初回注意 -->

<div class="modal" id="firstModal">

    <div class="modal-box">

        <h2>📘 注意事項</h2>

        <div style="line-height:1.8;">

            ・データは端末に保存されます<br><br>

            ・ブラウザデータ削除で消える場合があります<br><br>

            ・定期的にバックアップしてください<br><br>

            ・1日に何件でも記録できます

        </div>

        <button onclick="closeFirstModal()">
            はじめる
        </button>

    </div>

</div>

<!-- 通知 -->

<div id="toast"></div>

<script>

// ===== グローバル =====

let today;
let y;
let m;
let data={};

// ===== 通知 =====

function showToast(text){

    const toast=document.getElementById("toast");

    toast.innerText=text;

    toast.classList.add("show");

    setTimeout(()=>{

        toast.classList.remove("show");

    },2000);
}

// ===== ページ切替 =====

function showPage(id){

    document.getElementById("cal").style.display=
    id==="cal"?"block":"none";

    document.getElementById("rec").style.display=
    id==="rec"?"block":"none";
}

// ===== 月表示 =====

function updateMonthLabel(){

    document.getElementById("monthLabel").innerText=
    `${y}年 ${m+1}月`;
}

// ===== 前月 =====

function prevMonth(){

    m--;

    if(m<0){

        m=11;
        y--;
    }

    render();
}

// ===== 次月 =====

function nextMonth(){

    m++;

    if(m>11){

        m=0;
        y++;
    }

    render();
}

// ===== 保存 =====

function save(){

    const date=document.getElementById("date").value;

    const subject=document.getElementById("subject").value;

    const book=document.getElementById("book").value;

    const pages=document.getElementById("pages").value;

    const memo=document.getElementById("memo").value;

    if(!subject){

        showToast("⚠️ 教科を入力してください");
        return;
    }

    const p=date.split("-");

    const key=
    `${Number(p[0])}-${Number(p[1])}-${Number(p[2])}`;

    // 1日に複数保存

    if(!data[key]){

        data[key]=[];
    }

    data[key].push({

        subject,
        book,
        pages,
        memo
    });

    localStorage.setItem(
        "studyData",
        JSON.stringify(data)
    );

    render();

    showToast("✅ 保存しました");

    document.getElementById("subject").value="";
    document.getElementById("book").value="";
    document.getElementById("pages").value="";
    document.getElementById("memo").value="";
}

// ===== 統計 =====

function renderStats(){

    let totalPages=0;

    let totalRecords=0;

    let subjects=new Set();

    const last=
    new Date(y,m+1,0).getDate();

    for(let i=1;i<=last;i++){

        const key=`${y}-${m+1}-${i}`;

        const items=data[key];

        if(items){

            items.forEach(item=>{

                totalRecords++;

                totalPages+=Number(item.pages||0);

                if(item.subject){

                    subjects.add(item.subject);
                }

            });
        }
    }

    document.getElementById("statsText").innerHTML=
    `
    📄 ${totalPages}ページ<br>
    📚 ${subjects.size}教科<br>
    ✏️ ${totalRecords}件
    `;
}

// ===== カレンダー描画 =====

function render(){

    updateMonthLabel();

    renderStats();

    const cal=
    document.getElementById("calendar");

    cal.innerHTML="";

    const last=
    new Date(y,m+1,0).getDate();

    for(let i=1;i<=last;i++){

        const key=`${y}-${m+1}-${i}`;

        const items=data[key];

        const div=document.createElement("div");

        div.className="day";

        // 今日強調

        if(
            y===today.getFullYear() &&
            m===today.getMonth() &&
            i===today.getDate()
        ){

            div.classList.add("today");
        }

        div.onclick=()=>showDetail(i);

        let html=`<div class="date">${i}日</div>`;

        if(items){

            items.slice(0,2).forEach(item=>{

                html+=`
                <div class="subject">
                    ${item.subject}
                </div>

                <div class="memo">
                    ${item.book}<br>
                    ${item.pages}P
                </div>
                `;
            });

            html+=`
            <div class="count">
                ${items.length}件記録
            </div>
            `;

        }else{

            html+=`
            <div class="memo">
                未記録
            </div>
            `;
        }

        div.innerHTML=html;

        cal.appendChild(div);
    }
}

// ===== 詳細 =====

function showDetail(day){

    const key=`${y}-${m+1}-${day}`;

    const items=data[key];

    const detail=
    document.getElementById("detail");

    if(!items){

        detail.innerHTML="未記録";

    }else{

        let html="";

        items.forEach((item,index)=>{

            html+=`
            <div class="record">

                <b>${item.subject}</b><br>

                📘 ${item.book}<br>

                📄 ${item.pages}P<br>

                📝 ${item.memo}<br>

                <button class="deleteBtn"
                onclick="deleteRecord('${key}',${index})">
                    削除
                </button>

            </div>
            `;
        });

        detail.innerHTML=html;
    }

    document.getElementById(
        "detailModal"
    ).style.display="flex";
}

// ===== 削除 =====

function deleteRecord(key,index){

    data[key].splice(index,1);

    if(data[key].length===0){

        delete data[key];
    }

    localStorage.setItem(
        "studyData",
        JSON.stringify(data)
    );

    render();

    closeDetail();

    showToast("🗑️ 削除しました");
}

// ===== 閉じる =====

function closeDetail(){

    document.getElementById(
        "detailModal"
    ).style.display="none";
}

// ===== バックアップ =====

function exportData(){

    const json=
    localStorage.getItem("studyData");

    const blob=
    new Blob([json],{
        type:"application/json"
    });

    const url=
    URL.createObjectURL(blob);

    const a=document.createElement("a");

    a.href=url;

    a.download="study_backup.json";

    a.click();

    showToast("⬇️ ダウンロード開始");
}

// ===== 復元 =====

function importData(){

    const file=
    document.getElementById("file").files[0];

    if(!file){

        showToast("⚠️ ファイルを選択");
        return;
    }

    const reader=new FileReader();

    reader.onload=function(e){

        data=JSON.parse(e.target.result);

        localStorage.setItem(
            "studyData",
            JSON.stringify(data)
        );

        render();

        showToast("📦 復元しました");
    };

    reader.readAsText(file);
}

// ===== 初回注意 =====

function closeFirstModal(){

    document.getElementById(
        "firstModal"
    ).style.display="none";

    localStorage.setItem(
        "studyAppFirstOpen",
        "done"
    );
}

// ===== 起動 =====

window.addEventListener(
"DOMContentLoaded",
function(){

    today=new Date();

    y=today.getFullYear();

    m=today.getMonth();

    data=JSON.parse(
        localStorage.getItem("studyData")
    ) || {};

    // 初期日付

    document.getElementById("date").value=
    `${y}-${String(m+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;

    // 描画

    render();

    // 初回表示

    if(
        !localStorage.getItem(
            "studyAppFirstOpen"
        )
    ){

        document.getElementById(
            "firstModal"
        ).style.display="flex";
    }

});

</script>

</body>
</html>
