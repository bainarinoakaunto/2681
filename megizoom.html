<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEGI RESEARCH PORTAL</title>

<style>
:root{
    --primary:#0f172a;
    --secondary:#2563eb;
    --bg:#f8fafc;
    --card:#ffffff;
    --text:#1e293b;
    --border:#e2e8f0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Yu Gothic","Meiryo",sans-serif;
    background:var(--bg);
    color:var(--text);
}

header{
    background:var(--primary);
    color:#fff;
    padding:30px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.logo{
    font-size:2rem;
    font-weight:700;
    letter-spacing:2px;
}

.sub{
    margin-top:8px;
    opacity:.8;
}

.main-layout{
    max-width:1400px;
    margin:30px auto;
    padding:0 20px;
    display:grid;
    grid-template-columns:1fr 360px;
    gap:25px;
}

.container{
    width:100%;
}

.status-card{
    background:#fff;
    border-radius:14px;
    padding:20px;
    margin-bottom:25px;
    border:1px solid var(--border);
}

.status-title{
    font-size:1.1rem;
    font-weight:bold;
}

details{
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    margin-bottom:16px;
    overflow:hidden;
}

summary{
    cursor:pointer;
    list-style:none;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:bold;
}

summary::-webkit-details-marker{
    display:none;
}

summary::after{
    content:"＋";
    font-size:22px;
}

details[open] summary::after{
    content:"－";
}

.content{
    border-top:1px solid var(--border);
    padding:20px;
}

.label{
    color:#64748b;
    font-size:.9rem;
    margin-top:12px;
}

.value{
    font-weight:bold;
    margin-top:4px;
}
.join-btn{
    display:inline-block;
    margin-top:18px;
    background:var(--secondary);
    color:#fff;
    text-decoration:none;
    padding:12px 22px;
    border-radius:10px;
    font-weight:bold;
    transition:.2s;
}

.join-btn:hover{
    background:#1d4ed8;
}

.badge{
    background:#dbeafe;
    color:#1d4ed8;
    padding:6px 12px;
    border-radius:999px;
    font-size:13px;
}

/* ===== 右側 お知らせ ===== */

.notice-panel{
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    height:700px;
    position:sticky;
    top:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.notice-header{
    background:#dc2626;
    color:#fff;
    text-align:center;
    padding:15px;
    font-size:18px;
    font-weight:bold;
}

.notice-panel iframe{
    width:100%;
    height:calc(100% - 52px);
    border:none;
}

footer{
    text-align:center;
    padding:30px;
    color:#64748b;
}

@media(max-width:1000px){

.main-layout{
    grid-template-columns:1fr;
}

.notice-panel{
    position:static;
    height:500px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
NEGI RESEARCH PORTAL
</div>

<div class="sub">
ねぎ品種改良発表 オンライン会議システム
</div>

</header>

<div class="main-layout">

<div class="container">
<div class="status-card">

    <div class="status-title">
        開催予定の会議
    </div>

    <div id="meetingCount">
        読込中...
    </div>

</div>

<div id="meetings"></div>

</div>

<!-- ===================== -->
<!-- 右側 お知らせ -->
<!-- ===================== -->

<aside class="notice-panel">

    <div class="notice-header">
        📢 お知らせ
    </div>

    <iframe
        src="https://drive.google.com/file/d/1YfbpkuQp7Kimawx24LhKLY4IJGcvE0rK/preview"
        allow="autoplay">
    </iframe>

</aside>

</div>

<footer>
© 2026 NEGI RESEARCH PORTAL
</footer>

<script>

const meetings = [
{
    date:"2026-06-26",
    title:"ねぎ品種改良発表2026-06-26.20:30〜",
    meetingId:"823 6903 0809",
    password:"6z4nd5",
    zoom:"https://us05web.zoom.us/j/82369030809?pwd=fXdocGsGCy4Cn4nBabfsCuAKXxZA7b.1"
},
{
    date:"2026-06-27",
    title:"ねぎ品種改良発表②20:30〜",
    meetingId:"812 0984 6435",
    password:"6bAReQ",
    zoom:"https://us05web.zoom.us/j/81209846435?pwd=akaCpzD97j4FvuayHVH9CUbBsenW9F.1"
},
{
    date:"2026-06-28",
    title:"最終発表会20:30〜",
    meetingId:"869 9293 7976",
    password:"3B7107",
    zoom:"https://us05web.zoom.us/j/86992937976?pwd=uLbQ8ZSXXU3SI6nPaNeuKICsmBVFm2.1"
}
];


const container = document.getElementById("meetings");

document.getElementById("meetingCount").textContent =
`${meetings.length}件`;

class="join-btn"

`;

});

</script>

</body>

</html>
