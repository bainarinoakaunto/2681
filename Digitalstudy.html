<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digitalstudy</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
margin:0;
font-family:sans-serif;
background:#f4f7fb;
}

header{
background:#2563eb;
color:white;
padding:12px;
text-align:center;
font-weight:bold;
}

nav{
display:flex;
background:white;
position:sticky;
top:0;
border-bottom:1px solid #ddd;
}

nav button{
flex:1;
padding:10px;
border:none;
background:white;
cursor:pointer;
}

.page{display:none;padding:15px;}
.active{display:block;}

.card{
height:200px;
perspective:1000px;
margin:10px 0;
}

.inner{
width:100%;
height:100%;
position:relative;
transform-style:preserve-3d;
transition:0.5s;
}

.flip .inner{transform:rotateY(180deg);}

.front,.back{
position:absolute;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
border-radius:12px;
backface-visibility:hidden;
box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.front{background:white;}
.back{background:#2563eb;color:white;transform:rotateY(180deg);}

button{
padding:10px;
border:none;
border-radius:8px;
margin:4px;
cursor:pointer;
}

.ok{background:#22c55e;color:white;}
.ng{background:#ef4444;color:white;}
.next{background:#111;color:white;}
.add{background:#2563eb;color:white;}

.group{
background:white;
padding:10px;
border-radius:10px;
margin:5px 0;
cursor:pointer;
}

.bar{
height:14px;
background:#ddd;
border-radius:10px;
overflow:hidden;
}

.bar div{
height:100%;
background:#22c55e;
color:white;
font-size:11px;
text-align:center;
}

input,select{
width:100%;
padding:10px;
margin:5px 0;
border-radius:8px;
border:1px solid #ccc;
}

</style>
</head>

<body>

<header>Digitalstudy</header>

<nav>
<button onclick="go('study')">学習</button>
<button onclick="go('group')">単元</button>
<button onclick="go('add')">追加</button>
<button onclick="go('analysis')">分析</button>
<button onclick="go('backup')">保存</button>
</nav>

<!-- 学習 -->
<div class="page active" id="study">

<div class="card" onclick="flip()">
<div class="inner">
<div class="front" id="q"></div>
<div class="back" id="a"></div>
</div>
</div>

<button class="ok" onclick="ok()">正解</button>
<button class="ng" onclick="ng()">間違い</button>
<button onclick="speak()">🔊 発音</button>
<button class="next" onclick="next()">次</button>

</div>

<!-- 単元 -->
<div class="page" id="group">
<div id="groupList"></div>
</div>

<!-- 追加 -->
<div class="page" id="add">

<select id="subject">
<option>英語</option>
<option>数学</option>
<option>国語</option>
<option>理科</option>
<option>社会</option>
</select>

<input id="unit" placeholder="単元">

<button class="add" onclick="addGroup()">単元追加</button>

<hr>

<select id="gsel"></select>

<input id="qq" placeholder="問題（日本語）">
<input id="aa" placeholder="答え（英語可）">
<input id="kk" placeholder="漢字（任意）">

<button class="add" onclick="addCard()">カード追加</button>

</div>

<!-- 分析 -->
<div class="page" id="analysis">

<canvas id="chart"></canvas>

<div id="analysisBox"></div>

</div>

<!-- 保存 -->
<div class="page" id="backup">

<button onclick="saveFile()">保存</button>

<br><br>

<input type="file" id="file">
<button onclick="loadFile()">復元</button>

</div>

<script>

let data =
JSON.parse(localStorage.getItem("d")) || [];

let gi=0;
let ci=0;

let chart;

/* 保存 */
function save(){
localStorage.setItem("d",JSON.stringify(data));
}

/* ナビ */
function go(p){
document.querySelectorAll(".page")
.forEach(e=>e.classList.remove("active"));
document.getElementById(p).classList.add("active");
render();
}

/* 単元追加 */
function addGroup(){
data.push({
subject:subject.value,
unit:unit.value,
cards:[]
});
save();
render();
}

/* カード追加 */
function addCard(){

data[gsel.value].cards.push({
q:qq.value,
a:aa.value,
kanji:kk.value||"",
w:0
});

save();
render();

}

/* 表示 */
function render(){

let sel=document.getElementById("gsel");
if(sel){
sel.innerHTML="";
data.forEach((g,i)=>{
sel.innerHTML+=`
<option value="${i}">
${g.subject}｜${g.unit}
</option>`;
});
}

let html="";

data.forEach((g,i)=>{

let mem=memory(g);

html+=`
<div class="group" onclick="select(${i})">
<b>${g.subject}｜${g.unit}</b>
<div class="bar">
<div style="width:${mem}%">${mem}%</div>
</div>
</div>
`;

});

groupList.innerHTML=html;

analysis();

}

/* 記憶率 */
function memory(g){

if(!g.cards.length) return 0;

let sum=0;

g.cards.forEach(c=>{
sum+=100-c.w*10;
});

return Math.round(sum/g.cards.length);

}

/* 学習 */
function select(i){
gi=i;
next();
go('study');
}

function next(){

let g=data[gi];
if(!g||!g.cards.length) return;

g.cards.sort((a,b)=>b.w-a.w);

ci=Math.floor(Math.random()*Math.min(3,g.cards.length));

show(g.cards[ci]);

}

function show(c){

if(c.kanji){
q.innerText=c.kanji+"（"+c.q+"）";
}else{
q.innerText=c.q;
}

a.innerText=c.a;

}

/* 正誤 */
function ok(){
let c=data[gi].cards[ci];
if(c.w>0) c.w--;
save();
next();
}

function ng(){
data[gi].cards[ci].w++;
save();
next();
}

/* 🔊 発音 */
function speak(){

let c=data[gi].cards[ci];
if(!c) return;

let text=c.a;

/* 英語だけ発音 */
if(!/^[a-zA-Z\s]+$/.test(text)) return;

let uttr=new SpeechSynthesisUtterance(text);
uttr.lang="en-US";
uttr.rate=0.9;

speechSynthesis.speak(uttr);

}

/* グラフ */
function draw(acc,mem,wrong){

if(chart) chart.destroy();

chart=new Chart(chartCanvas,{

type:"bar",
data:{
labels:["正解率","記憶率","ミス"],
datasets:[{
data:[acc,mem,wrong],
backgroundColor:["#22c55e","#3b82f6","#ef4444"]
}]
},

options:{
responsive:true,
scales:{y:{beginAtZero:true,max:100}}
}

});

}

/* 分析 */
function analysis(){

let total=0;
let correct=0;
let wrong=0;

data.forEach(g=>{
g.cards.forEach(c=>{
total++;
wrong+=c.w;
if(c.w===0) correct++;
});
});

let acc=total?Math.round(correct/total*100):0;
let mem=total?Math.round((total-wrong)/total*100):0;

analysisBox.innerHTML=`
正解率：${acc}%<br>
記憶率：${mem}%<br>
ミス：${wrong}
`;

draw(acc,mem,Math.min(100,wrong*5));

}

/* 保存 */
function saveFile(){

let b=new Blob([JSON.stringify(data)]);
let a=document.createElement("a");
a.href=URL.createObjectURL(b);
a.download="study.json";
a.click();

}

/* 復元 */
function loadFile(){

let f=file.files[0];

let r=new FileReader();

r.onload=e=>{
data=JSON.parse(e.target.result);
save();
render();
};

r.readAsText(f);

}

/* flip */
function flip(){
document.querySelector(".card")
.classList.toggle("flip");
}

render();

</script>

</body>
</html>
