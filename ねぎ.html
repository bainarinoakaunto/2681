<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ねぎ品種改良 LIVE配信</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#video{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
}

.live{
    position:fixed;
    top:15px;
    left:15px;
    background:#d90000;
    color:#fff;
    padding:8px 16px;
    border-radius:6px;
    font-size:20px;
    font-weight:bold;
    z-index:1000;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0.5;
    }
}

.clock-box{
    position:fixed;
    top:10px;
    right:10px;
    z-index:1000;
}

#clock{
    background:#fff;
    border-radius:50%;
    box-shadow:0 0 10px rgba(0,0,0,.5);
}

.info{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:rgba(0,0,0,.65);
    color:#fff;
    padding:12px;
    font-size:18px;
    z-index:1000;
}

.camera-btn{
    position:fixed;
    top:60px;
    right:20px;
    border:none;
    background:#fff;
    color:#000;
    padding:10px 15px;
    border-radius:8px;
    font-size:15px;
    cursor:pointer;
    display:none;
    z-index:1001;
}

.camera-btn:hover{
    background:#eee;
}
</style>
</head>
<body>

<div class="live">🔴 LIVE</div>

<div class="clock-box">
    <canvas id="clock" width="120" height="120"></canvas>
</div>

<button class="camera-btn" onclick="switchCamera()">
📷 前後カメラ切替
</button>

<video id="video" autoplay playsinline muted></video>

<div class="info">
    🌱 現在の現場ライブカメラ
    <span id="datetime"></span>
</div>

<script>
const video = document.getElementById("video");
const cameraBtn = document.querySelector(".camera-btn");

let currentStream = null;
let currentFacing = "environment";

async function startCamera(facing){

    try{

        if(currentStream){
            currentStream.getTracks().forEach(track => track.stop());
        }

        const stream =
        await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:facing
            },
            audio:false
        });

        currentStream = stream;
        video.srcObject = stream;

    }catch(error){
        alert("カメラが利用できません。");
        console.error(error);
    }
}

function switchCamera(){

    currentFacing =
    currentFacing === "environment"
    ? "user"
    : "environment";

    startCamera(currentFacing);
}

startCamera(currentFacing);

/* 日時 */
function updateDateTime(){
    document.getElementById("datetime").textContent =
    new Date().toLocaleString("ja-JP");
}

setInterval(updateDateTime,1000);
updateDateTime();

/* アナログ時計 */
const canvas = document.getElementById("clock");
const ctx = canvas.getContext("2d");
const radius = canvas.height / 2;

ctx.translate(radius,radius);

function drawHand(pos,length,width){
    ctx.beginPath();
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.moveTo(0,0);
    ctx.rotate(pos);
    ctx.lineTo(0,-length);
    ctx.stroke();
    ctx.rotate(-pos);
}

function drawClock(){

    ctx.clearRect(
        -radius,
        -radius,
        canvas.width,
        canvas.height
    );

    ctx.beginPath();
    ctx.arc(0,0,radius-2,0,2*Math.PI);
    ctx.fillStyle="white";
    ctx.fill();
    ctx.strokeStyle="black";
    ctx.lineWidth=2;
    ctx.stroke();

    for(let n=1;n<=12;n++){

        let ang=n*Math.PI/6;

        ctx.save();

        ctx.rotate(ang);
        ctx.translate(0,-radius*0.8);
        ctx.rotate(-ang);

        ctx.font="14px Arial";
        ctx.fillStyle="black";
        ctx.textAlign="center";
        ctx.fillText(n,0,5);

        ctx.restore();
    }

    const now = new Date();

    const hour =
    (now.getHours()%12)*Math.PI/6 +
    now.getMinutes()*Math.PI/(6*60);

    const minute =
    now.getMinutes()*Math.PI/30;

    const second =
    now.getSeconds()*Math.PI/30;

    drawHand(hour,radius*0.5,6);
    drawHand(minute,radius*0.75,4);
    drawHand(second,radius*0.9,2);
}

setInterval(drawClock,1000);
drawClock();

/* 時計ダブルクリックでボタン表示 */
let hideTimer;

canvas.addEventListener("dblclick",()=>{

    cameraBtn.style.display="block";

    clearTimeout(hideTimer);

    hideTimer=setTimeout(()=>{
        cameraBtn.style.display="none";
    },10000);
});

/* スマホ長押し3秒で表示 */
let pressTimer;

canvas.addEventListener("touchstart",()=>{

    pressTimer=setTimeout(()=>{

        cameraBtn.style.display="block";

        clearTimeout(hideTimer);

        hideTimer=setTimeout(()=>{
            cameraBtn.style.display="none";
        },10000);

    },3000);

});

canvas.addEventListener("touchend",()=>{
    clearTimeout(pressTimer);
});
</script>

</body>
</html>
