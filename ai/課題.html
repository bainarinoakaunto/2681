<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リンク題名機能付き 課題管理アプリ</title>
    <style>
        :root {
            --primary: #4a6fa5;
            --secondary: #16a085;
            --danger: #e74c3c;
            --warning: #f39c12;
            --priority: #e67e22;
            --bg: #f4f6f9;
            --card: #ffffff;
            --text: #333333;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }

        /* 上部ダッシュボード */
        .app-header {
            max-width: 800px;
            margin: 0 auto 10px auto;
            background: linear-gradient(135deg, var(--primary), #35537d);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .app-title { font-size: 20px; font-weight: bold; margin: 0; }
        
        /* ⏰ 秒数まで表示するリアルタイム時計エリア */
        .date-dashboard { 
            font-size: 15px; 
            background: rgba(255,255,255,0.2); 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace, sans-serif; /* 数字幅を固定してガタツキ防止 */
        }

        /* 📻 電光掲示板（ニュースティッカー）全体のスタイル */
        .ticker-board {
            max-width: 800px;
            margin: 0 auto 15px auto;
            background-color: #111111;
            border: 2px solid #333;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 2px 5px rgba(0,0,0,0.2);
            padding: 8px 0;
            display: flex;
            align-items: center;
        }

        /* 横スクロールアニメーション */
        .ticker-track {
            display: flex;
            white-space: nowrap;
            padding-left: 100%;
            animation: ticker-move 25s linear infinite;
        }

        /* マウスホバーで一時停止 */
        .ticker-board:hover .ticker-track {
            animation-play-state: paused;
        }

        .ticker-item {
            font-family: 'Courier New', Courier, monospace, sans-serif;
            font-weight: bold;
            font-size: 14px;
            color: #00ffcc;
            margin-right: 50px;
            text-shadow: 0 0 6px #00ffcc;
        }
        .ticker-item.ticker-priority {
            color: #ff9900;
            text-shadow: 0 0 6px #ff9900;
            font-size: 15px;
        }

        @keyframes ticker-move {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* 画面切り替えナビゲーション */
        .nav-menu {
            display: flex;
            max-width: 800px;
            margin: 0 auto 15px auto;
            background: #e2e8f0;
            border-radius: 8px;
            padding: 4px;
            gap: 4px;
        }
        .nav-item {
            flex: 1;
            text-align: center;
            padding: 10px 5px;
            cursor: pointer;
            font-weight: bold;
            color: #4a5568;
            border-radius: 6px;
            transition: 0.2s;
            font-size: 13px;
        }
        .nav-item.active {
            background: var(--card);
            color: var(--primary);
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        /* メインコンテナ */
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        /* 表示切り替え用 */
        .page-content { display: none; }
        .page-content.active { display: block; }

        /* 登録フォーム */
        .task-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .form-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

        .links-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #fff;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .link-input-group { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
        @media (max-width: 500px) { .link-input-group { grid-template-columns: 1fr; gap: 4px; } }

        input { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        button.add-btn { background-color: var(--primary); color: white; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 5px; }

        /* 切り替えタブ */
        .tabs { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 15px; }
        .tab { flex: 1; text-align: center; padding: 8px; cursor: pointer; font-weight: bold; color: #666; font-size: 14px; }
        .tab.active { color: var(--primary); border-bottom: 3px solid var(--primary); margin-bottom: -2px; }

        /* タスクアイテム */
        .task-list { list-style: none; padding: 0; margin: 0; }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #fdfdfd;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            margin-bottom: 10px;
            gap: 10px;
        }
        .task-item.priority { border: 2px solid var(--priority); background-color: #fffaf5; }
        .task-info { display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .task-title { font-weight: bold; font-size: 15px; }
        
        .priority-badge { background-color: var(--priority); color: white; font-size: 10px; padding: 1px 5px; border-radius: 4px; margin-right: 5px; }
        .subject-badge { background: #e8edf5; color: var(--primary); padding: 1px 5px; border-radius: 4px; font-size: 11px; margin-right: 5px; font-weight: bold; }
        .due-badge { color: var(--danger); font-weight: bold; font-size: 11px; }
        .deleted-notice { color: #888; font-size: 11px; margin-top: 2px; }

        .task-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
        .attachment-link { font-size: 11px; color: var(--primary); text-decoration: none; background: #f0f4f8; padding: 3px 8px; border-radius: 12px; border: 1px solid #d0dbe5; }
        .attachment-link:hover { background: #e1ebf5; }

        .task-actions { display: flex; gap: 6px; align-items: center; }
        .action-btn { border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .complete-btn { background-color: var(--secondary); color: white; }
        .return-btn { background-color: var(--warning); color: white; }
        .delete-btn { background-color: var(--danger); color: white; }
        .star-btn { background: none; border: none; color: #ccc; font-size: 18px; cursor: pointer; padding: 0 4px; }
        .star-btn.active { color: var(--priority); }

        /* 最優先エリア */
        .priority-section { background: #fff5eb; border: 1px solid #fbd38d; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .section-title { font-size: 15px; font-weight: bold; color: var(--priority); margin-top: 0; margin-bottom: 12px; }
        .mini-priority-item { background: white; padding: 12px; border-radius: 6px; margin-bottom: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); display: flex; justify-content: space-between; }

        /* 安全用バックアップ */
        .settings-card { background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; }
        .backup-btns { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .io-btn { padding: 8px 14px; background: #4a6fa5; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .io-btn.import { background: #4a5568; }

        .empty-message { text-align: center; color: #999; padding: 20px; font-size: 13px; }
    </style>
</head>
<body>

<div class="app-header">
    <div class="header-row">
        <h1 class="app-title">📝 課題タスクマネージャー</h1>
        <div class="date-dashboard" id="date_dashboard">取得中...</div>
    </div>
</div>

<div class="ticker-board" title="マウスを乗せると一時停止します">
    <div class="ticker-track" id="ticker_track"></div>
</div>

<div class="nav-menu">
    <div class="nav-item active" id="nav_view" onclick="switchPage('view')">📋 課題を見る</div>
    <div class="nav-item" id="nav_add" onclick="switchPage('add')">➕ 課題を登録する</div>
    <div class="nav-item" id="nav_sub" onclick="switchPage('sub')">💾 データ管理</div>
</div>

<div class="container">

    <div id="page_view" class="page-content active">
        <div class="priority-section">
            <div class="section-title">🔥 期限が近い最優先課題</div>
            <div id="priority_task_list"></div>
        </div>

        <div class="tabs">
            <div class="tab active" id="tab_uncompleted" onclick="switchTab('uncompleted')">未提出 (<span id="count_uncompleted">0</span>)</div>
            <div class="tab" id="tab_completed" onclick="switchTab('completed')">提出済み (<span id="count_completed">0</span>)</div>
        </div>
        <ul id="task_list" class="task-list"></ul>
    </div>

    <div id="page_add" class="page-content">
        <h2 style="font-size: 16px; color: var(--primary); margin-top: 0; margin-bottom: 12px;">➕ 新しい課題の追加</h2>
        <div class="task-form">
            <div class="form-row">
                <input type="text" id="task_title" placeholder="課題名（必須）">
                <input type="text" id="task_subject" placeholder="科目名">
                <input type="date" id="task_due">
            </div>
            
            <div class="links-area">
                <div style="font-size: 12px; color: #666; font-weight: bold; margin-bottom: 4px;">関連リンク（最大3つ）</div>
                <div class="link-input-group">
                    <input type="text" id="link_title1" placeholder="題名（例: Classroom）">
                    <input type="text" id="link_url1" placeholder="URL (https://...)">
                </div>
                <div class="link-input-group">
                    <input type="text" id="link_title2" placeholder="題名（例: 配布資料）">
                    <input type="text" id="link_url2" placeholder="URL">
                </div>
                <div class="link-input-group">
                    <input type="text" id="link_title3" placeholder="題名">
                    <input type="text" id="link_url3" placeholder="URL">
                </div>
            </div>
            <button class="add-btn" onclick="addTask()">課題を追加する</button>
        </div>
    </div>

    <div id="page_sub" class="page-content">
        <div class="settings-card">
            <div style="font-weight: bold; font-size: 14px; color: #2d3748;">💾 データのバックアップ保存</div>
            <div style="font-size: 12px; color: #718096; margin-top: 4px;">PCの移行時やブラウザのデータ自動削除に備えて、課題データをテキストファイルとして保存・復元できます。</div>
            <div class="backup-btns">
                <button class="io-btn" onclick="exportData()">データをファイルに書き出す</button>
                <button class="io-btn import" onclick="document.getElementById('import_file').click()">ファイルから復元する</button>
                <input type="file" id="import_file" style="display: none;" onchange="importData(this)">
            </div>
        </div>
    </div>

</div>

<script>
    const STORAGE_KEY = 'perfect_assignment_tasks_v3';
    let tasks = [];
    let currentTab = 'uncompleted';
    
    // ⏰ リアルタイムで「秒」まで時計を動かす関数
    function updateClock() {
        try {
            const weeks = ['日', '月', '火', '水', '木', '金', '土'];
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const w = weeks[now.getDay()];
            
            // 時・分・秒の取得と桁揃え
            const hrs = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const secs = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('date_dashboard').innerText = `${y}年${m}月${d}日 (${w}) ${hrs}:${mins}:${secs}`;
        } catch(e) {
            document.getElementById('date_dashboard').innerText = "時計エラー";
        }
    }

    // 最初に一度動かし、以降は1秒(1000ms)ごとに関数を実行する
    updateClock();
    setInterval(updateClock, 1000);

    // データの自動読み込み
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) tasks = JSON.parse(saved);
    } catch(e) {
        console.log("ストレージ制限回避");
    }

    cleanOldTasks();
    render();

    function switchPage(page) {
        document.getElementById('nav_view').classList.toggle('active', page === 'view');
        document.getElementById('nav_add').classList.toggle('active', page === 'add');
        document.getElementById('nav_sub').classList.toggle('active', page === 'sub');
        
        document.getElementById('page_view').classList.toggle('active', page === 'view');
        document.getElementById('page_add').classList.toggle('active', page === 'add');
        document.getElementById('page_sub').classList.toggle('active', page === 'sub');
    }

    function cleanOldTasks() {
        const FOUR_WEEKS_MS = 4 * 7 * 24 * 60 * 60 * 1000;
        const now = Date.now();
        tasks = tasks.filter(t => {
            if (t.completed && t.completedAt) {
                return (now - t.completedAt) < FOUR_WEEKS_MS; 
            }
            return true;
        });
        saveTasks();
    }

    function addTask() {
        const title = document.getElementById('task_title').value.trim();
        const subject = document.getElementById('task_subject').value.trim() || 'その他';
        const due = document.getElementById('task_due').value || '期限なし';
        
        if (!title) { alert('課題名を入力してください！'); return; }

        const links = [];
        for (let i = 1; i <= 3; i++) {
            const lTitle = document.getElementById(`link_title${i}`).value.trim();
            const lUrl = document.getElementById(`link_url${i}`).value.trim();
            if (lUrl) {
                links.push({ name: lTitle || `リンク [${i}]`, url: lUrl });
            }
        }

        tasks.push({
            id: Date.now(),
            title: title,
            subject: subject,
            due: due,
            completed: false,
            completedAt: null,
            isPriority: false,
            links: links
        });

        saveTasks();
        render();

        document.getElementById('task_title').value = '';
        document.getElementById('task_subject').value = '';
        document.getElementById('task_due').value = '';
        for (let i = 1; i <= 3; i++) {
            document.getElementById(`link_title${i}`).value = '';
            document.getElementById(`link_url${i}`).value = '';
        }

        switchPage('view');
    }

    function togglePriority(id) {
        tasks = tasks.map(t => t.id === id ? {...t, isPriority: !t.isPriority} : t);
        saveTasks();
        render();
    }

    function toggleComplete(id) {
        tasks = tasks.map(t => {
            if (t.id === id) {
                const nextStatus = !t.completed;
                return { ...t, completed: nextStatus, completedAt: nextStatus ? Date.now() : null };
            }
            return t;
        });
        saveTasks();
        render();
    }

    function deleteTask(id) {
        if (confirm('この課題を削除しますか？')) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            render();
        }
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tab_uncompleted').classList.toggle('active', tab === 'uncompleted');
        document.getElementById('tab_completed').classList.toggle('active', tab === 'completed');
        render();
    }

    function saveTasks() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch(e) {}
    }

    function exportData() {
        if(tasks.length === 0) { alert("保存するデータがありません。"); return; }
        const blob = new Blob([JSON.stringify(tasks, null, 2)], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'assignment_backup.txt';
        a.click();
    }

    function importData(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                tasks = JSON.parse(e.target.result);
                saveTasks();
                render();
                alert("データを復元しました！");
            } catch(err) { alert("正しいバックアップファイルではありません。"); }
        };
        reader.readAsText(file);
    }

    function render() {
        const listContainer = document.getElementById('task_list');
        const priorityContainer = document.getElementById('priority_task_list');
        const tickerTrack = document.getElementById('ticker_track');
        
        listContainer.innerHTML = '';
        priorityContainer.innerHTML = '';
        tickerTrack.innerHTML = '';

        const uncompletedTasks = tasks.filter(t => !t.completed);
        document.getElementById('count_uncompleted').innerText = uncompletedTasks.length;
        document.getElementById('count_completed').innerText = tasks.filter(t => t.completed).length;

        // 電光掲示板の組み立て
        if (uncompletedTasks.length === 0) {
            tickerTrack.innerHTML = `<span class="ticker-item">🎉 現在、未提出の課題はありません！お疲れ様です！</span>`;
        } else {
            const tickerSorted = [...uncompletedTasks].sort((a, b) => (b.isPriority - a.isPriority));
            let tickerHtml = "";
            tickerSorted.forEach(t => {
                const priorityClass = t.isPriority ? 'ticker-priority' : '';
                const prefix = t.isPriority ? '🔥【最優先】' : '📌';
                tickerHtml += `<span class="ticker-item ${priorityClass}">${prefix} ${t.title} (⏰期限: ${t.due})</span>`;
            });
            tickerTrack.innerHTML = tickerHtml + tickerHtml;
        }

        // 最優先リストの描画
        const priorityTasks = tasks.filter(t => t.isPriority && !t.completed);
        priorityTasks.sort((a, b) => {
            if (a.due === '期限なし') return 1;
            if (b.due === '期限なし') return -1;
            return new Date(a.due) - new Date(b.due);
        });

        if (priorityTasks.length === 0) {
            priorityContainer.innerHTML = `<div class="empty-message">最優先に設定された未提出の課題はありません。</div>`;
        } else {
            priorityTasks.forEach(t => {
                priorityContainer.innerHTML += `
                    <div class="mini-priority-item">
                        <div>
                            <div style="font-weight:bold;">${t.title}</div>
                            <div style="font-size:11px; color:#666; margin-top:2px;">📚 ${t.subject}</div>
                        </div>
                        <div style="color:var(--danger); font-weight:bold; font-size:13px;">⏰ ${t.due}</div>
                    </div>`;
            });
        }

        // メイン課題リストの描画
        let filtered = tasks.filter(t => currentTab === 'completed' ? t.completed : !t.completed);
        filtered.sort((a, b) => {
            if (a.due === '期限なし' && b.due === '期限なし') {
                if (a.isPriority && !b.isPriority) return -1;
                if (!a.isPriority && b.isPriority) return 1;
                return b.id - a.id;
            }
            if (a.due === '期限なし') return 1;
            if (b.due === '期限なし') return -1;

            const dateA = new Date(a.due);
            const dateB = new Date(b.due);

            if (dateA.getTime() !== dateB.getTime()) {
                return dateA - dateB;
            } else {
                if (a.isPriority && !b.isPriority) return -1;
                if (!a.isPriority && b.isPriority) return 1;
                return b.id - a.id;
            }
        });

        if (filtered.length === 0) {
            listContainer.innerHTML = `<li class="empty-message">表示する課題はありません。</li>`;
            return;
        }

        filtered.forEach(t => {
            const li = document.createElement('li');
            li.className = `task-item ${t.isPriority ? 'priority' : ''}`;

            let linksHtml = '';
            if (t.links && t.links.length > 0) {
                linksHtml = `<div class="task-links">`;
                t.links.forEach(l => {
                    linksHtml += `<a href="${l.url.startsWith('http') ? l.url : 'https://'+l.url}" target="_blank" class="attachment-link">🔗 ${l.name}</a>`;
                });
                linksHtml += `</div>`;
            }

            let deleteNoticeHtml = '';
            if (t.completed && t.completedAt) {
                const msPassed = Date.now() - t.completedAt;
                const daysLeft = Math.ceil((4 * 7 * 24 * 60 * 60 * 1000 - msPassed) / (24 * 60 * 60 * 1000));
                deleteNoticeHtml = `<div class="deleted-notice">※あと約 ${daysLeft} 日で自動クリーンアップされます</div>`;
            }

            li.innerHTML = `
                <div class="task-info">
                    <div style="display:flex; align-items:center; flex-wrap:wrap; gap:4px;">
                        ${t.isPriority ? `<span class="priority-badge">最優先</span>` : ''}
                        <div class="task-title">${t.title}</div>
                    </div>
                    <div style="margin-top:2px;">
                        <span class="subject-badge">${t.subject}</span>
                        <span class="due-badge">⏰ 期限: ${t.due}</span>
                        ${deleteNoticeHtml}
                    </div>
                    ${linksHtml}
                </div>
                <div class="task-actions">
                    <button class="star-btn ${t.isPriority ? 'active' : ''}" onclick="togglePriority(${t.id})">
                        ${t.isPriority ? '★' : '☆'}
                    </button>
                    <button class="action-btn ${t.completed ? 'return-btn' : 'complete-btn'}" onclick="toggleComplete(${t.id})">
                        ${t.completed ? '戻す' : '完了'}
                    </button>
                    <button class="action-btn delete-btn" onclick="deleteTask(${t.id})">削除</button>
                </div>`;
            listContainer.appendChild(li);
        });
    }
</script>
</body>
</html>
