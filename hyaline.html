<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百均トラッカー（自動入力対応）</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: sans-serif;
  background: #f0f4ff;
  padding: 20px;
}
h1 { text-align: center; color: #4CAF50; }

form {
  background: white;
  padding: 15px;
  border-radius: 10px;
  max-width: 600px;
  margin: auto;
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
}

button {
  background: #4CAF50;
  color: white;
  border: none;
}

#preview {
  width: 100%;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>百均トラッカー（神機能版）</h1>

<form id="itemForm">
  <input type="text" id="name" placeholder="商品名（自動入力）">
  <input type="text" id="price" placeholder="価格">
  <input type="text" id="store" placeholder="店舗">

  <input type="text" id="jan" placeholder="JANコード">
  <button type="button" onclick="startScanner()">📷 スキャン</button>

  <div id="preview"></div>

  <select id="category">
    <option value="">カテゴリ</option>
    <option>文具</option>
    <option>キッチン</option>
    <option>生活雑貨</option>
  </select>

  <button type="submit">保存</button>
</form>

<script>
let scanner;

function startScanner() {
  scanner = new Html5Qrcode("preview");

  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (decodedText) => {
      document.getElementById("jan").value = decodedText;

      // ⭐ 商品名取得
      fetchProduct(decodedText);

      scanner.stop();
    }
  );
}

// ⭐ 楽天APIで商品取得
async function fetchProduct(jan) {
  const APP_ID = "YOUR_APP_ID"; // ←ここ変更

  const url = `https://app.rakuten.co.jp/services/api/IchibaItem/Search/20170706?format=json&applicationId=${APP_ID}&keyword=${jan}`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    if (data.Items.length > 0) {
      const item = data.Items[0].Item;

      document.getElementById("name").value = item.itemName;

      // 価格も入れたい場合
      document.getElementById("price").value = item.itemPrice;
    } else {
      alert("商品見つからず（100均はヒットしないことあり）");
    }

  } catch (e) {
    alert("取得エラー");
  }
}

// 保存（簡易）
document.getElementById("itemForm").addEventListener("submit", e => {
  e.preventDefault();
  alert("保存OK（ここは自由に拡張できる）");
});
</script>

</body>
</html>
