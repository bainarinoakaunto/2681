<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百均新商品トラッカー（バーコード対応）</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background-color: #f0f4ff;
  margin: 0;
  padding: 20px;
  color: #333;
}
h1 { text-align: center; color: #4CAF50; }

form, .search-container {
  background: #fff;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.1);
  max-width: 600px;
  margin: 0 auto 20px auto;
}

input, select, textarea, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  margin-bottom: 12px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

button {
  background-color: #4CAF50;
  color: white;
  border: none;
}

table {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  border-collapse: collapse;
  background: #fff;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #ddd;
}

th { background-color: #4CAF50; color: white; }
</style>
</head>

<body>

<h1>百均新商品トラッカー</h1>

<form id="itemForm">
  <input type="text" id="name" placeholder="商品名 *" required>
  <input type="text" id="price" placeholder="価格 *" required>
  <input type="text" id="store" placeholder="店舗名 *" required>

  <input type="text" id="jan" placeholder="JANコード">
  <button type="button" onclick="startScanner()">📷 バーコード読み取り</button>

  <div id="preview"></div>

  <select id="category" required>
    <option value="">カテゴリ *</option>
    <option value="文具">文具</option>
    <option value="キッチン">キッチン</option>
    <option value="生活雑貨">生活雑貨</option>
    <option value="その他">その他</option>
  </select>

  <textarea id="memo" placeholder="メモ"></textarea>

  <button type="submit">商品を追加</button>
</form>

<div class="search-container">
  <input type="text" id="searchInput" placeholder="検索">
  <button onclick="exportCSV()">📁 CSVエクスポート</button>
</div>

<table id="itemTable">
<thead>
<tr>
<th>時間</th>
<th>商品名</th>
<th>価格</th>
<th>店舗</th>
<th>JAN</th>
<th>カテゴリ</th>
<th>削除</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
const form = document.getElementById('itemForm');
const tableBody = document.querySelector('#itemTable tbody');
const searchInput = document.getElementById('searchInput');

let items = JSON.parse(localStorage.getItem('items')) || [];
let scanner;

function renderItems() {
  tableBody.innerHTML = '';
  const text = searchInput.value.toLowerCase();

  items.forEach((item, index) => {
    if (!JSON.stringify(item).toLowerCase().includes(text)) return;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.time}</td>
      <td>${item.name}</td>
      <td>${item.price}</td>
      <td>${item.store}</td>
      <td>${item.jan || ''}</td>
      <td>${item.category}</td>
      <td><button onclick="deleteItem(${index})">削除</button></td>
    `;
    tableBody.appendChild(tr);
  });
}

function deleteItem(index) {
  items.splice(index, 1);
  localStorage.setItem('items', JSON.stringify(items));
  renderItems();
}

form.addEventListener('submit', e => {
  e.preventDefault();

  const newItem = {
    time: new Date().toLocaleString(),
    name: document.getElementById('name').value,
    price: document.getElementById('price').value,
    store: document.getElementById('store').value,
    jan: document.getElementById('jan').value,
    category: document.getElementById('category').value
  };

  items.push(newItem);
  localStorage.setItem('items', JSON.stringify(items));
  form.reset();
  renderItems();
});

searchInput.addEventListener('input', renderItems);

// 📷 バーコード
function startScanner() {
  scanner = new Html5Qrcode("preview");

  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (decodedText) => {
      document.getElementById('jan').value = decodedText;
      stopScanner();
    }
  );
}

function stopScanner() {
  if (scanner) scanner.stop();
}

// 📁 CSVエクスポート
function exportCSV() {
  if (items.length === 0) {
    alert("データがありません");
    return;
  }

  const header = ["時間","商品名","価格","店舗","JAN","カテゴリ"];

  const rows = items.map(item => [
    item.time,
    item.name,
    item.price,
    item.store,
    item.jan || "",
    item.category
  ]);

  const csvContent = [header, ...rows]
    .map(e => e.map(v => `"${v}"`).join(","))
    .join("\n");

  const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv" });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `items_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

renderItems();
</script>

</body>
</html>
