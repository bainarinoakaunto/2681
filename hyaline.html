<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百均新商品トラッカー</title>
<style>
  body { font-family: 'Helvetica', 'Arial', sans-serif; margin:20px; background:#f0f2f5; color:#333; }
  h1 { text-align:center; color:#444; }
  form { background:#fff; padding:15px; border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1); margin-bottom:20px; }
  input, select, textarea, button { width:100%; margin:5px 0; padding:10px; border-radius:5px; border:1px solid #ccc; box-sizing:border-box; }
  button { background:#4CAF50; color:#fff; border:none; font-weight:bold; }
  button:hover { background:#45a049; }
  .search-filter { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px; }
  .search-filter input, .search-filter select, .search-filter button { flex:1; min-width:120px; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 2px 5px rgba(0,0,0,0.1); display:block; overflow-x:auto; }
  th, td { border-bottom:1px solid #eee; padding:10px; text-align:left; white-space:nowrap; }
  th { background:#f7f7f7; }
  td button { background:#2196F3; margin-left:5px; padding:5px 8px; font-size:0.9em; }
  td button:hover { background:#1976D2; }
  @media (max-width:600px) {
    th, td { font-size:14px; padding:8px; }
    input, select, textarea, button { font-size:14px; }
  }
</style>
</head>
<body>

<h1>百均新商品トラッカー</h1>

<form id="itemForm">
  <input type="text" id="name" placeholder="商品名*" required>
  <input type="text" id="price" placeholder="価格*" required>
  <input type="text" id="store" placeholder="店舗名*" required>
  <input type="text" id="category" placeholder="カテゴリ*" required>
  <textarea id="memo" placeholder="メモ"></textarea>
  <button type="submit">商品を追加</button>
</form>

<div class="search-filter">
  <input type="text" id="searchText" placeholder="商品名・店舗・メモで検索">
  <select id="categoryFilter">
    <option value="">カテゴリで絞り込み</option>
  </select>
  <button onclick="downloadCSV()">CSVでダウンロード</button>
</div>

<table>
  <thead>
    <tr>
      <th>登録時間</th>
      <th>商品名</th>
      <th>価格</th>
      <th>店舗名</th>
      <th>カテゴリ</th>
      <th>メモ</th>
      <th>操作</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>
let items = [];

const form = document.getElementById('itemForm');
form.addEventListener('submit', (e) => {
  e.preventDefault();
  const name = document.getElementById('name').value;
  const price = document.getElementById('price').value;
  const store = document.getElementById('store').value;
  const category = document.getElementById('category').value;
  const memo = document.getElementById('memo').value;
  const time = new Date().toLocaleString();

  items.push({name, price, store, category, memo, time});
  updateCategoryFilter();
  renderTable();
  form.reset();
});

function renderTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  const searchText = document.getElementById('searchText').value.toLowerCase();
  const categoryFilter = document.getElementById('categoryFilter').value;

  const filteredItems = items.filter(item => {
    const matchesText = item.name.toLowerCase().includes(searchText) ||
                        item.store.toLowerCase().includes(searchText) ||
                        item.memo.toLowerCase().includes(searchText);
    const matchesCategory = categoryFilter === '' || item.category === categoryFilter;
    return matchesText && matchesCategory;
  });

  filteredItems.forEach((item, index) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.time}</td>
      <td>${item.name} <button onclick="googleSearch('${item.name}')">🔍</button></td>
      <td>${item.price}</td>
      <td>${item.store}</td>
      <td>${item.category}</td>
      <td>${item.memo}</td>
      <td><button onclick="deleteItem(${index})">削除</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function updateCategoryFilter() {
  const select = document.getElementById('categoryFilter');
  const categories = [...new Set(items.map(item => item.category))];
  select.innerHTML = '<option value="">カテゴリで絞り込み</option>';
  categories.forEach(cat => {
    const option = document.createElement('option');
    option.value = cat;
    option.textContent = cat;
    select.appendChild(option);
  });
}

document.getElementById('searchText').addEventListener('input', renderTable);
document.getElementById('categoryFilter').addEventListener('change', renderTable);

function deleteItem(index) {
  if(confirm('本当に削除しますか？')) {
    items.splice(index, 1);
    updateCategoryFilter();
    renderTable();
  }
}

function googleSearch(query) {
  const url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
  window.open(url, '_blank');
}

function downloadCSV() {
  let csv = '登録時間,商品名,価格,店舗名,カテゴリ,メモ\n';
  items.forEach(item => {
    csv += `"${item.time}","${item.name}","${item.price}","${item.store}","${item.category}","${item.memo}"\n`;
  });
  const blob = new Blob([csv], {type: 'text/csv'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = '商品トラッカー.csv';
  link.click();
}
</script>

</body>
</html>
