<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百均新商品トラッカー</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background-color: #f0f4ff;
    margin: 0;
    padding: 20px;
    color: #333;
  }
  h1 {
    text-align: center;
    color: #4CAF50;
  }
  form {
    background: #fff;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    max-width: 600px;
    margin: 0 auto 20px auto;
  }
  input, select, textarea, button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    margin-bottom: 12px;
    border-radius: 5px;
    border: 1px solid #ccc;
    font-size: 16px;
  }
  button {
    background-color: #4CAF50;
    color: white;
    border: none;
    cursor: pointer;
  }
  button:hover {
    background-color: #45a049;
  }
  table {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    border-collapse: collapse;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
  }
  th, td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    text-align: left;
  }
  th {
    background-color: #4CAF50;
    color: white;
  }
  tr:last-child td {
    border-bottom: none;
  }
</style>
</head>
<body>

<h1>百均新商品トラッカー</h1>

<form id="itemForm">
  <input type="text" id="name" placeholder="商品名 *" required>
  <input type="text" id="price" placeholder="価格 *" required>
  <input type="text" id="store" placeholder="店舗名 *" required>
  <select id="category" required>
    <option value="">カテゴリ *</option>
    <option value="文具">文具</option>
    <option value="キッチン">キッチン</option>
    <option value="生活雑貨">生活雑貨</option>
    <option value="その他">その他</option>
  </select>
  <textarea id="memo" placeholder="メモ"></textarea>
  <button type="submit">商品を追加</button>
</form>

<div style="text-align:center; margin-bottom:10px;">
  <button onclick="downloadCSV()">CSVでダウンロード</button>
</div>

<table id="itemTable">
  <thead>
    <tr>
      <th>記録時間</th>
      <th>商品名</th>
      <th>価格</th>
      <th>店舗名</th>
      <th>カテゴリ</th>
      <th>メモ</th>
      <th>削除</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const form = document.getElementById('itemForm');
const tableBody = document.querySelector('#itemTable tbody');

let items = JSON.parse(localStorage.getItem('items')) || [];

function renderItems() {
  tableBody.innerHTML = '';
  items.forEach((item, index) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.time}</td>
      <td>${item.name}</td>
      <td>${item.price}</td>
      <td>${item.store}</td>
      <td>${item.category}</td>
      <td>${item.memo}</td>
      <td><button onclick="deleteItem(${index})">削除</button></td>
    `;
    tableBody.appendChild(tr);
  });
}

function deleteItem(index) {
  items.splice(index, 1);
  localStorage.setItem('items', JSON.stringify(items));
  renderItems();
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const now = new Date();
  const newItem = {
    time: now.toLocaleString(),
    name: document.getElementById('name').value,
    price: document.getElementById('price').value,
    store: document.getElementById('store').value,
    category: document.getElementById('category').value,
    memo: document.getElementById('memo').value
  };
  items.push(newItem);
  localStorage.setItem('items', JSON.stringify(items));
  renderItems();
  form.reset();
});

// CSVダウンロード機能
function downloadCSV() {
  if (items.length === 0) return alert('データがありません。');
  let csv = '記録時間,商品名,価格,店舗名,カテゴリ,メモ\n';
  items.forEach(item => {
    const row = [item.time, item.name, item.price, item.store, item.category, item.memo]
      .map(v => `"${v.replace(/"/g,'""')}"`) // カンマや引用符対応
      .join(',');
    csv += row + '\n';
  });
  const blob = new Blob([csv], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '百均新商品トラッカー.csv';
  a.click();
  URL.revokeObjectURL(url);
}

renderItems();
</script>

</body>
</html>
