<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>パスワード生成</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f7f7f7;
    font-family:
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
    color:#222;
}

.card{
    width:340px;
    background:#fff;
    border-radius:20px;
    padding:28px;
    box-shadow:0 8px 24px rgba(0,0,0,0.08);
}

h1{
    margin:0 0 24px;
    text-align:center;
    font-size:24px;
    font-weight:700;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    font-weight:600;
}

select,
input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
    background:#fafafa;
    margin-bottom:18px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#111;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    opacity:.9;
}

.result{
    margin-top:18px;
    padding:14px;
    border-radius:12px;
    background:#f3f3f3;
    word-break:break-all;
    text-align:center;
    font-size:18px;
    font-weight:700;
    min-height:56px;
}

.copy{
    margin-top:12px;
    background:#eaeaea;
    color:#111;
}

.copy:hover{
    background:#ddd;
}

.strength{
    margin-top:10px;
    text-align:center;
    font-size:14px;
    color:#666;
}
</style>
</head>
<body>

<div class="card">

    <h1>🔐 パスワード生成</h1>

    <label>用途</label>
    <select id="type">
        <option value="normal">SNS・普段使い</option>
        <option value="strong">重要アカウント</option>
        <option value="bank">銀行・決済用</option>
        <option value="ultra">超強力</option>
    </select>

    <label>文字数</label>
    <input type="number" id="length" value="16" min="8" max="64">

    <button onclick="generatePassword()">
        生成する
    </button>

    <div class="result" id="password"></div>

    <div class="strength" id="strength"></div>

    <button class="copy" onclick="copyPassword()">
        コピー
    </button>

</div>

<script>
function generatePassword(){

    const type =
    document.getElementById("type").value;

    const length =
    parseInt(document.getElementById("length").value);

    let chars = "";

    switch(type){

        case "normal":
            chars =
            "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            break;

        case "strong":
            chars =
            "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%";
            break;

        case "bank":
            chars =
            "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
            break;

        case "ultra":
            chars =
            "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=[]{}";
            break;
    }

    let password = "";

    for(let i = 0; i < length; i++){

        const random =
        crypto.getRandomValues(new Uint32Array(1))[0] % chars.length;

        password += chars[random];
    }

    document.getElementById("password").textContent =
    password;

    let strength = "";

    if(length < 10){
        strength = "強度：弱め";
    }
    else if(length < 16){
        strength = "強度：普通";
    }
    else if(length < 24){
        strength = "強度：強い";
    }
    else{
        strength = "強度：超強力";
    }

    document.getElementById("strength").textContent =
    strength;
}

function copyPassword(){

    const password =
    document.getElementById("password").textContent;

    navigator.clipboard.writeText(password);

    alert("コピーしました");
}

generatePassword();
</script>

</body>
</html>
