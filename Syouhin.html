<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV表表示</title>
<style>
body { font-family: sans-serif; padding: 10px; background: #f4f4f4; }
h1 { text-align: center; font-size: 20px; margin-bottom: 10px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; background: white; }
th, td { border: 1px solid #ccc; padding: 6px; text-align: left; font-size: 14px; }
th { background: #eee; }
</style>
</head>
<body>

<h1>CSV 表示</h1>
<div class="table-wrap">
<table id="csvTable">
<thead></thead>
<tbody></tbody>
</table>
</div>

<script>
const csvFile = "./情報.csv"; // 同じフォルダに CSV を置く

fetch(csvFile)
  .then(res => res.text())
  .then(text => {
    const lines = text.trim().split("\n");
    const table = document.getElementById("csvTable");
    
    // ヘッダー
    const headers = lines[0].split("\t");
    const thead = table.querySelector("thead");
    thead.innerHTML = "<tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr>";
    
    // 本文
    const tbody = table.querySelector("tbody");
    lines.slice(1).forEach(line => {
      const cols = line.split("\t");
      tbody.innerHTML += "<tr>" + cols.map(c => `<td>${c}</td>`).join("") + "</tr>";
    });
  })
  .catch(err => console.error("CSV読み込みエラー:", err));
</script>

</body>
</html>
