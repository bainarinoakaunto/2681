<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百均商品トラッカー（完全対応）</title>

<style>
body {
    font-family: sans-serif;
    padding: 10px;
    background: #f4f4f4;
}
h1 {
    text-align: center;
}
input {
    width: 100%;
    padding: 10px;
    margin-bottom: 8px;
}
.table-wrap {
    overflow-x: auto;
}
table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}
th, td {
    border-bottom: 1px solid #ddd;
    padding: 6px;
}
.total {
    text-align: right;
    margin-top: 10px;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>百均商品トラッカー</h1>

<input type="file" id="fileInput" accept=".csv,.txt">
<input type="text" id="search" placeholder="検索">
<input type="date" id="dateFilter">

<div class="table-wrap">
<table>
<thead>
<tr>
<th>日付</th>
<th>時間</th>
<th>商品</th>
<th>価格</th>
<th>店舗</th>
<th>カテゴリ</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<div class="total" id="total"></div>

<script>
let data = [];

const tbody = document.getElementById("tableBody");
const totalDiv = document.getElementById("total");

// 価格変換（円・カンマ対応）
function parsePrice(str) {
    return Number(str.replace(/[¥円,]/g, ""));
}

// CSV/TSV読み込み
document.getElementById("fileInput").addEventListener("change", function(e) {
    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = function(event) {
        const text = event.target.result.trim();
        const lines = text.split("\n");

        data = lines.slice(1).map(line => {
            const cols = line.split("\t"); // タブ区切り

            const datetime = cols[0];
            const [date, time] = datetime.split(" ");

            return {
                date: date.replace(/\//g, "-"),
                time: time,
                name: cols[1],
                price: parsePrice(cols[2]),
                store: cols[3],
                category: cols[4]
            };
        });

        render();
    };

    reader.readAsText(file);
});

// 表示
function render() {
    const keyword = document.getElementById("search").value.toLowerCase();
    const selectedDate = document.getElementById("dateFilter").value;

    tbody.innerHTML = "";
    let total = 0;

    data.forEach(item => {
        if (!item.name) return;

        const text = (item.name + item.store + item.category).toLowerCase();

        if (selectedDate && item.date !== selectedDate) return;
        if (!text.includes(keyword)) return;

        const row = `
        <tr>
            <td>${item.date}</td>
            <td>${item.time}</td>
            <td>${item.name}</td>
            <td>¥${item.price}</td>
            <td>${item.store}</td>
            <td>${item.category}</td>
        </tr>`;
        tbody.innerHTML += row;
        total += item.price;
    });

    totalDiv.innerText = "合計: ¥" + total;
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("dateFilter").addEventListener("change", render);
</script>

</body>
</html>
