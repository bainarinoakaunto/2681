<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSVそのまま表示</title>
<style>
body { font-family: monospace; padding: 10px; background: #f4f4f4; }
pre { background: white; padding: 10px; border-radius: 5px; overflow-x: auto; }
</style>
</head>
<body>

<h1>CSVファイル内容</h1>
<pre id="csvContent">読み込み中…</pre>

<script>
// CSV ファイル名（同じフォルダに配置）
const csvFile = "./情報.csv";

fetch(csvFile)
  .then(res => res.text())
  .then(text => {
    document.getElementById("csvContent").innerText = text;
  })
  .catch(err => {
    document.getElementById("csvContent").innerText = "CSV読み込みエラー: " + err;
  });
</script>

</body>
</html>
