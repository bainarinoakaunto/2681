<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百均商品トラッカー</title>

<style>
body {
    font-family: sans-serif;
    margin: 0;
    padding: 10px;
    background: #f4f4f4;
}

h1 {
    text-align: center;
    font-size: 20px;
}

/* 検索 */
input {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    font-size: 16px;
    box-sizing: border-box;
}

/* カテゴリボタン */
.buttons {
    display: flex;
    overflow-x: auto;
    margin-bottom: 10px;
}
button {
    flex: none;
    margin-right: 5px;
    padding: 10px;
    border: none;
    background: #ddd;
    border-radius: 8px;
    font-size: 14px;
}
button.active {
    background: #4CAF50;
    color: white;
}

/* テーブル */
table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    font-size: 14px;
}
th, td {
    padding: 6px;
    border-bottom: 1px solid #ddd;
}

/* スマホ用：横スクロール */
.table-wrap {
    overflow-x: auto;
}

/* 合計 */
.total {
    margin-top: 10px;
    text-align: right;
    font-weight: bold;
    font-size: 16px;
}
</style>
</head>

<body>

<h1>百均商品トラッカー</h1>

<input type="text" id="search" placeholder="検索">

<div class="buttons">
<button onclick="setCategory('')" class="active">すべて</button>
<button onclick="setCategory('文具')">文具</button>
<button onclick="setCategory('生活雑貨')">生活雑貨</button>
<button onclick="setCategory('その他')">その他</button>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>時間</th>
<th>商品</th>
<th>¥</th>
<th>店</th>
<th>カテゴリ</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<div class="total" id="total"></div>

<script>
const data = [
{time:"7:37", name:"オリズルラン", price:110, store:"ダイソー", category:"その他"},
{time:"7:41", name:"くす玉", price:110, store:"ダイソー", category:"その他"},
{time:"7:42", name:"テープライトLED 3m", price:330, store:"ダイソー", category:"その他"},
{time:"7:44", name:"テープライト5m", price:550, store:"ダイソー", category:"その他"},
{time:"7:45", name:"小型ハサミ", price:110, store:"ダイソー", category:"文具"},
{time:"7:46", name:"紙せっけん", price:110, store:"ダイソー", category:"生活雑貨"},
{time:"8:42", name:"インクジェット紙", price:110, store:"ダイソー", category:"その他"},
{time:"10:03", name:"紛失防止タグ", price:1000, store:"ダイソー", category:"その他"},
{time:"14:51", name:"ボイスライト", price:330, store:"ダイソー", category:"その他"}
];

let currentCategory = "";

const tbody = document.getElementById("tableBody");
const totalDiv = document.getElementById("total");

function render() {
    const keyword = document.getElementById("search").value.toLowerCase();
    tbody.innerHTML = "";
    let total = 0;

    data.forEach(item => {
        const text = (item.name + item.store + item.category).toLowerCase();

        if (!text.includes(keyword)) return;
        if (currentCategory && item.category !== currentCategory) return;

        const row = `
        <tr>
            <td>${item.time}</td>
            <td>${item.name}</td>
            <td>${item.price}</td>
            <td>${item.store}</td>
            <td>${item.category}</td>
        </tr>`;
        tbody.innerHTML += row;
        total += item.price;
    });

    totalDiv.innerText = "合計: ¥" + total;
}

function setCategory(cat) {
    currentCategory = cat;

    document.querySelectorAll("button").forEach(btn => btn.classList.remove("active"));
    event.target.classList.add("active");

    render();
}

document.getElementById("search").addEventListener("input", render);

render();
</script>

</body>
</html>
